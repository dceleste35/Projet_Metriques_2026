<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Histogramme Paris — Google ColumnChart</title>

  <script src="https://www.gstatic.com/charts/loader.js"></script>

  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 24px; }
    #chart { width: 100%; height: 520px; }
    #status { margin-top: 12px; white-space: pre-wrap; }
  </style>
</head>

<body>
  <h1>Prévisions météo Paris — Histogramme</h1>
  <div id="chart"></div>
  <div id="status"></div>

  <script>
    google.charts.load('current', { packages: ['corechart'] });
    google.charts.setOnLoadCallback(init);

    let cachedRows = null;

    async function init() {
      try {
        const rows = await fetchParisData();
        cachedRows = rows;
        drawChart(rows);

        window.addEventListener('resize', () => {
          if (cachedRows) drawChart(cachedRows);
        });
      } catch (err) {
        showStatus("Erreur: " + (err?.message || err));
        console.error(err);
      }
    }

    async function fetchParisData() {
      const res = await fetch('/paris', { headers: { 'Accept': 'application/json' } });

      if (!res.ok) {
        throw new Error(`HTTP ${res.status} sur /paris`);
      }

      const json = await res.json();

      // Regrouper par jour et calculer la moyenne
      const parJour = {};
      json.forEach(p => {
        const jour = p.datetime.split('T')[0];
        if (!parJour[jour]) parJour[jour] = [];
        parJour[jour].push(Number(p.temperature_c));
      });

      const rows = Object.keys(parJour).sort().map(jour => {
        const temps = parJour[jour];
        const moyenne = temps.reduce((a, b) => a + b, 0) / temps.length;
        return [jour, Math.round(moyenne * 10) / 10];
      });

      return rows;
    }

    function drawChart(rows) {
      const data = new google.visualization.DataTable();
      data.addColumn('string', 'Jour');
      data.addColumn('number', 'Température moyenne (°C)');
      data.addRows(rows);

      const options = {
        title: 'Température moyenne par jour — Paris (7 prochains jours)',
        legend: { position: 'none' },
        hAxis: { title: 'Jour' },
        vAxis: { title: '°C' },
        colors: ['#4285F4'],
        bar: { groupWidth: '60%' }
      };

      const chart = new google.visualization.ColumnChart(document.getElementById('chart'));
      chart.draw(data, options);

      showStatus(`OK — ${rows.length} jours chargés depuis /paris`);
    }

    function showStatus(msg) {
      document.getElementById('status').textContent = msg;
    }
  </script>
</body>
</html>
